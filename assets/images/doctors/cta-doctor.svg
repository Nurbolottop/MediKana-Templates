<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5f4"/>
      <stop offset="100%" style="stop-color:#d4edea"/>
    </linearGradient>
    <linearGradient id="doctorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F6B66"/>
      <stop offset="100%" style="stop-color:#128a84"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#ctaBg)" rx="16"/>
  
  <!-- Doctor figure -->
  <g transform="translate(150, 200)">
    <!-- Body -->
    <rect x="-60" y="20" width="120" height="120" rx="10" fill="url(#doctorGrad)" opacity="0.9"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="45" fill="white" opacity="0.9"/>
    <!-- Hair -->
    <path d="M-40,-35 Q-20,-60 0,-55 Q20,-60 40,-35 Q45,-20 40,-10 L-40,-10 Q-45,-20 -40,-35" fill="#4a4a4a" opacity="0.3"/>
    <!-- Face -->
    <circle cx="-12" cy="-20" r="4" fill="#4a4a4a" opacity="0.5"/>
    <circle cx="12" cy="-20" r="4" fill="#4a4a4a" opacity="0.5"/>
    <path d="M-8,-5 Q0,0 8,-5" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Stethoscope -->
    <path d="M-35,20 Q-35,60 0,70 Q35,60 35,20" stroke="#0F6B66" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="0" cy="75" r="8" fill="#0F6B66" opacity="0.4"/>
  </g>
  
  <!-- Floating elements -->
  <circle cx="50" cy="80" r="25" fill="#0F6B66" opacity="0.1"/>
  <circle cx="250" cy="320" r="35" fill="#D72536" opacity="0.08"/>
  <rect x="220" y="60" width="40" height="6" rx="3" fill="#0F6B66" opacity="0.2"/>
  <rect x="230" y="75" width="30" height="4" rx="2" fill="#0F6B66" opacity="0.15"/>
  
  <text x="150" y="380" text-anchor="middle" font-family="system-ui" font-size="11" fill="#0F6B66" opacity="0.5">CTA Doctor Image</text>
</svg>
