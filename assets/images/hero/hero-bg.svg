<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F6B66;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0a4f4b;stop-opacity:0.95" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGrad)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  
  <!-- Medical Icons -->
  <g transform="translate(400, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="2"/>
    <path d="M-30,-10 L30,-10 M0,-40 L0,20" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="50" r="15" fill="none" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="350" text-anchor="middle" font-family="system-ui" font-size="14" fill="rgba(255,255,255,0.6)">Hero Banner Placeholder</text>
</svg>
