<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9f8"/>
      <stop offset="100%" style="stop-color:#e0f2f0"/>
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F6B66;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0F6B66;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="circle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D72536;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#D72536;stop-opacity:0.02"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="url(#circle1)"/>
  <circle cx="500" cy="400" r="200" fill="url(#circle2)"/>
  <circle cx="450" cy="150" r="80" fill="url(#circle1)"/>
  
  <!-- Medical illustration placeholder -->
  <g transform="translate(300, 250)">
    <!-- Stethoscope -->
    <path d="M-60,-80 Q-80,-80 -80,-40 Q-80,0 -40,0 Q0,0 0,-40 L0,-100" stroke="#0F6B66" stroke-width="3" fill="none" opacity="0.3"/>
    <circle cx="0" cy="-100" r="15" stroke="#0F6B66" stroke-width="3" fill="none" opacity="0.3"/>
    <ellipse cx="-60" cy="-80" rx="20" ry="15" stroke="#0F6B66" stroke-width="3" fill="none" opacity="0.3"/>
    
    <!-- Heart with pulse -->
    <path d="M-20,40 Q-30,30 -20,20 Q-10,10 0,20 Q10,10 20,20 Q30,30 20,40 Q0,60 -20,40" fill="#D72536" opacity="0.2"/>
    
    <!-- Plus sign -->
    <rect x="80" y="-60" width="40" height="8" rx="2" fill="#0F6B66" opacity="0.3"/>
    <rect x="96" y="-76" width="8" height="40" rx="2" fill="#0F6B66" opacity="0.3"/>
    
    <!-- Pills -->
    <ellipse cx="-100" cy="60" rx="20" height="10" fill="#0F6B66" opacity="0.2"/>
    <ellipse cx="-70" cy="80" rx="15" height="8" fill="#D72536" opacity="0.15"/>
    
    <!-- Microscope/lab equipment suggestion -->
    <rect x="60" y="40" width="30" height="50" rx="3" stroke="#0F6B66" stroke-width="2" fill="none" opacity="0.2"/>
    <circle cx="75" cy="30" r="15" stroke="#0F6B66" stroke-width="2" fill="none" opacity="0.2"/>
  </g>
  
  <text x="300" y="480" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0F6B66" opacity="0.5">Hero Medical Illustration</text>
</svg>
